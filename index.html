<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evelyn Gao</title>
    <meta
      name="description"
      content="Evelyn Gao — Computer Science &amp; Statistics at the University of Chicago. I build the data pipelines, validation and tooling that keep ML systems working."
    />

    <!-- Regenerate these with scripts/make-icons.sh after changing logo.png. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The browser chrome follows the page. Two values rather than one, so
         the bar above a dark page is not left painted cream. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fffdf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#4b4542" />

    <!--
      The remembered light/dark choice, applied before the first paint (#70,
      #73). It has to run here, synchronously in <head> and ahead of the
      stylesheet, or the page paints cream and then switches — the flash of the
      wrong theme that a saved preference is supposed to prevent.

      Kept to one attribute and no fallback to `prefers-color-scheme`: a first
      visit is light, and only a choice the visitor made here is remembered.
      src/hooks/useTheme.js reads this attribute as its starting value, so the
      two cannot disagree; the storage key is spelled out in both places and
      has to stay in step.
    -->
    <script>
      try {
        if (localStorage.getItem('evelyn-site-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {
        /* storage blocked — light, as a first visit would be */
      }
    </script>

    <!--
      Deliberately no og:url and no canonical. This file is the shell every
      route is served from, so either one would hardcode the homepage onto
      /projects/proxima and friends — telling crawlers the whole site is a
      duplicate of / and pointing shared links back at the front page. Left
      out, scrapers use the URL they actually fetched. Per-route tags would
      need prerendering, which this build does not do.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Evelyn Gao" />
    <meta property="og:title" content="Evelyn Gao" />
    <meta
      property="og:description"
      content="Computer Science &amp; Statistics at the University of Chicago. I build the data pipelines, validation and tooling that keep ML systems working."
    />
    <meta property="og:image" content="https://whitesandooz.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Evelyn Gao's hand-drawn face logo on cream paper" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Alegreya is the content font (#68): every editorial heading on the site is
      set in it. Regular only — 400 upright and 400 italic — because nothing
      here asks for a bold or a second weight, and loading one would invite a
      synthesised one. Cormorant Garamond stays for the homepage's wind letters
      and nothing else; they are the one documented exception to the swap.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
