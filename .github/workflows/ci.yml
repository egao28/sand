name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Warn on new critical CVEs in transitive deps without blocking unrelated PRs.
      - run: npm audit --audit-level=critical
        continue-on-error: true
      - run: npm run lint
      - run: npm run format:check
      # The contact endpoint's own suite. Every service it talks to is stubbed,
      # so this sends no mail and touches no deployed URL.
      - run: npm run test:contact
      - run: npm run build
      # After the build, so the scan sees the real bundle and not just the
      # sources: a secret reaches the browser through what Vite inlines.
      - run: npm run check:secrets
