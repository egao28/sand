name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Warn on new critical CVEs in transitive deps without blocking unrelated PRs.
      - run: npm audit --audit-level=critical
        continue-on-error: true
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
